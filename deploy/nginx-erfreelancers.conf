# REFERENCE ONLY: do not blindly copy over the active production virtual host.
# Prefer nginx-existing-vhost-snippet.conf and preserve the site's SSL, API,
# static/upload/media routing, limits, renewal settings and unrelated hosts.
# This full example does not know the production uploads/media storage paths.
# Do not add a duplicate virtual host.
# Verify the certificate contains BOTH names before enabling this configuration.
# The FastAPI service must listen on 127.0.0.1:8018 and have a built frontend.

server {
    listen 80;
    listen [::]:80;
    server_name erfreelancers.com www.erfreelancers.com;

    # Preserve the current ACME challenge location here if renewal uses webroot.
    return 301 https://erfreelancers.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.erfreelancers.com;

    ssl_certificate /etc/letsencrypt/live/erfreelancers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erfreelancers.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://erfreelancers.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name erfreelancers.com;

    ssl_certificate /etc/letsencrypt/live/erfreelancers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erfreelancers.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Retain a larger existing limit if the site's upload workflow needs it.
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # Block dotfiles; public assets are served by the backend from frontend/build.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location / {
        # No `try_files $uri /index.html`: that would bypass server HTML and 404s.
        # This also serves /robots.txt, /sitemap.xml and /sitemaps/*.xml.
        proxy_pass http://127.0.0.1:8018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        # Preserve streaming chat responses and backend HTTP status codes.
        proxy_buffering off;
        proxy_intercept_errors off;
    }
}
