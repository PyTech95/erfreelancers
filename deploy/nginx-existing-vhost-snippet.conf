# PREFERRED: MERGE these locations into the EXISTING erfreelancers.com HTTPS host.
# This file is NOT a complete server block. Do not enable it as another site.
#
# First install the included proxy directives:
# sudo install -m 644 /var/www/erfreelancers/deploy/nginx-public-proxy.inc \
#   /etc/nginx/snippets/erfreelancers-public-proxy.conf
#
# Replace existing locations with the same name; do not create duplicates.
# Preserve existing /api/, /static/, /uploads/ and /media/ routes and their limits.
# Remove any existing exact `location = /` that serves the CRA index; it would
# override `location /` below. Review regex locations that intercept page URLs.
# Preserve SSL certificates, certbot directives, other hostnames, access rules,
# existing HTTP/www canonical redirects and the certificate-renewal method.

location / {
    include /etc/nginx/snippets/erfreelancers-public-proxy.conf;
}

# These explicit routes supersede old static files / API rewrite workarounds.
location = /robots.txt {
    include /etc/nginx/snippets/erfreelancers-public-proxy.conf;
}

location = /sitemap.xml {
    include /etc/nginx/snippets/erfreelancers-public-proxy.conf;
}

location ^~ /sitemaps/ {
    include /etc/nginx/snippets/erfreelancers-public-proxy.conf;
}

# Do NOT rewrite all /locations/ paths. The backend validates each old path,
# returns 301 only for valid migrated pages, preserves /locations/ itself,
# and returns genuine 404 responses for synthetic/unknown places.
